[[tools]]
id = "wacli"
name = "wacli"
binary = "wacli"
category = "utilities"
backend = "mise:ubi"
package = "steipete/wacli"
sudo = false
profiles = ["desktop", "server"]
description = "WhatsApp CLI bridge used by OpenClaw personal agents."
install_cmd = "mise use --global ubi:steipete/wacli@latest"
update_cmd = "mise upgrade ubi:steipete/wacli"
remove_cmd = "mise unuse --global ubi:steipete/wacli"
version_args = ["--version"]
version_regex = '([0-9]+\.[0-9]+\.[0-9]+)'

[[tools]]
id = "hcloud"
name = "Hetzner Cloud CLI"
binary = "hcloud"
category = "utilities"
backend = "mise:aqua"
package = "hetznercloud/cli"
sudo = false
profiles = ["desktop", "server"]
description = "Official Hetzner Cloud CLI for managing remote VPS agent instances."
install_cmd = "mise use --global aqua:hetznercloud/cli@latest"
update_cmd = "mise upgrade aqua:hetznercloud/cli"
remove_cmd = "mise unuse --global aqua:hetznercloud/cli"
version_args = ["version"]
version_regex = 'hcloud ([0-9]+\.[0-9]+\.[0-9]+)'

[[tools]]
id = "visidata"
name = "VisiData"
binary = "vd"
category = "utilities"
backend = "uv"
package = "visidata"
sudo = false
profiles = ["desktop", "server"]
description = "Interactive terminal spreadsheet and tabular data explorer for CSV, JSONL, and SQLite."
install_cmd = "mise x uv -- uv tool install visidata"
update_cmd = "mise x uv -- uv tool upgrade visidata"
remove_cmd = "mise x uv -- uv tool uninstall visidata"
version_args = ["--version"]
version_regex = 'saul\.pw/VisiData v?([0-9]+\.[0-9]+(?:\.[0-9]+)?)|v?([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
