# Outfitter's embedded, opinionated default catalog.
# User overrides belong in ~/.config/outfitter/catalog.toml.

[settings]
install_dir = "~/.local/bin"
auto_bootstrap_mise = true
github_token_from_gh = true

[[categories]]
id = "harnesses"
num = 1
title = "CODING HARNESSES"

[[categories]]
id = "ai-tuis"
num = 2
title = "AI TUIS & PERSONAL TOOLS"

[[categories]]
id = "terminal"
num = 3
title = "TERMINAL & SESSION MANAGEMENT"

[[categories]]
id = "utilities"
num = 4
title = "AGENT & CLI UTILITIES"

[[profiles]]
id = "desktop"
name = "Full Desktop"
short = "Desktop"
description = "Complete workstation rig: all coding harnesses, AI TUIs, terminal tools, and browser/MCP utilities."
tools = [
  "claude-code", "codex", "muse", "antigravity-cli", "opencode", "pi", "gemini-cli", "copilot-cli",
  "boardwalk", "trailmark", "quotary", "codexbar", "openclaw", "mercadona-cli",
  "tmux", "hive", "gh", "lazygit", "fzf", "delta", "glow", "ripgrep", "fd", "jq", "btop",
  "zoxide", "eza", "bat", "dust", "broot", "tig", "htop",
  "browser-use", "mcporter", "oracle", "summarize", "wacli", "hcloud", "visidata",
]

[[profiles]]
id = "server"
name = "Headless Server / VPS"
short = "Server"
description = "Tuned for Ubuntu home servers & Hetzner VPS agent workers (no desktop GUI or browser dependencies)."
tools = [
  "claude-code", "codex", "muse", "antigravity-cli", "opencode",
  "boardwalk", "trailmark", "openclaw", "mercadona-cli",
  "tmux", "hive", "gh", "lazygit", "fzf", "delta", "ripgrep", "fd", "jq", "btop",
  "zoxide", "eza", "bat", "dust", "broot", "tig", "htop",
  "wacli", "hcloud", "visidata",
]

[[profiles]]
id = "harnesses"
name = "Coding Harnesses Only"
short = "Harnesses"
description = "All 8 AI coding harnesses managed cleanly via vendor updaters and mise Node shims."
tools = [
  "claude-code", "codex", "muse", "antigravity-cli", "opencode", "pi", "gemini-cli", "copilot-cli",
]

[[profiles]]
id = "minimal"
name = "Minimal Core"
short = "Minimal"
description = "Essential daily drivers: Claude Code, Codex, Boardwalk, Trailmark, tmux, gh, fzf, rg, jq, zoxide."
tools = [
  "claude-code", "codex", "boardwalk", "trailmark", "tmux", "gh", "fzf", "ripgrep", "jq", "zoxide",
]

# Category 1: Coding Harnesses

[[tools]]
id = "claude-code"
name = "Claude Code"
binary = "claude"
category = "harnesses"
backend = "vendor"
package = "anthropic/claude-code"
sudo = false
profiles = ["desktop", "server", "harnesses", "minimal"]
description = "Anthropic agentic coding CLI with MCP servers, hooks, skills, and memory."
install_cmd = "curl -fsSL https://claude.ai/install.sh | sh"
update_cmd = "claude update"
remove_cmd = "rm -rf ~/.local/bin/claude ~/.local/share/claude"
version_args = ["--version"]
version_regex = '([0-9]+\.[0-9]+\.[0-9]+)'

[[tools]]
id = "codex"
name = "OpenAI Codex CLI"
binary = "codex"
category = "harnesses"
backend = "mise:npm"
package = "@openai/codex"
sudo = false
profiles = ["desktop", "server", "harnesses", "minimal"]
description = "OpenAI local coding agent CLI with session logs and reasoning controls."
install_cmd = "mise use --global npm:@openai/codex@latest"
update_cmd = "mise upgrade npm:@openai/codex"
remove_cmd = "mise unuse --global npm:@openai/codex"
version_args = ["--version"]
version_regex = '([0-9]+\.[0-9]+\.[0-9]+)'

[[tools]]
id = "muse"
name = "Muse Code"
binary = "muse"
category = "harnesses"
backend = "vendor"
package = "api.meta.ai/muse-code (muse-stable)"
sudo = false
profiles = ["desktop", "server", "harnesses"]
description = "Meta agentic coding CLI driving Wonder and Wonder Full models."
install_cmd = "curl -fsSL https://api.meta.ai/muse-launcher.sh -o ~/.local/bin/muse && chmod +x ~/.local/bin/muse"
update_cmd = "MUSE_UPDATE_INTERVAL_SECONDS=0 muse --version"
remove_cmd = "rm -f ~/.local/bin/muse ~/.local/bin/muse-bin-* ~/.local/bin/.muse-*"
version_args = ["--version"]
version_regex = '([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?)'

[[tools]]
id = "antigravity-cli"
name = "Antigravity CLI"
binary = "agy"
category = "harnesses"
backend = "vendor"
package = "google-deepmind/antigravity-cli"
sudo = false
profiles = ["desktop", "server", "harnesses"]
description = "Google DeepMind agentic coding assistant CLI (agy) with subagents and skills."
install_cmd = "agy self-update --install ~/.local/bin/agy"
update_cmd = "agy update"
remove_cmd = "rm -f ~/.local/bin/agy"
version_args = ["--version"]
version_regex = '([0-9]+\.[0-9]+\.[0-9]+)'

[[tools]]
id = "opencode"
name = "OpenCode v2"
binary = "opencode"
category = "harnesses"
backend = "vendor"
package = "sst/opencode"
sudo = false
profiles = ["desktop", "server", "harnesses"]
description = "Terminal-native AI coding agent (v2) with multi-provider support."
install_cmd = "curl -fsSL https://opencode.ai/install | bash"
update_cmd = "opencode upgrade"
remove_cmd = "rm -rf ~/.opencode ~/.local/bin/opencode"
version_args = ["--version"]
version_regex = '([0-9]+\.[0-9]+\.[0-9]+)'

[[tools]]
id = "pi"
name = "Pi Coding Agent"
binary = "pi"
category = "harnesses"
backend = "mise:npm"
